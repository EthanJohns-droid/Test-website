<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Website – It Works!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0d3a5c, #1a5f8f);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .box {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1.15rem;
      opacity: 0.9;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 22px;
      border-radius: 100px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>It Works!</h1>
    <p>If you can see this page, your GitHub Pages website is working correctly.</p>
    <div class="badge">Test Successful ✓</div>
  </div>
</body>
</html>
